server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # compressão de texto
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # fontes e imagens mudam de nome quando mudam: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # a página em si é sempre revalidada
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
