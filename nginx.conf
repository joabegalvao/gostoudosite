server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # atrás do proxy do EasyPanel, os redirecionamentos (/pasta -> /pasta/)
    # precisam ser relativos, sem host nem porta
    absolute_redirect off;
    port_in_redirect off;

    # compressão de texto
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # fontes e imagens (deste site e dos sites dos clientes): cache longo
    location ~* \.(css|js|woff2|webp|jpg|jpeg|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # a página principal (o portfólio) sai como está, sem o selo
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # as páginas dos sites dos clientes (/pasta/) recebem o selo do showroom:
    # um script inserido antes do </body>, que desenha a marca do Gostou do
    # site? no canto da tela. Ver assets/showroom/selo.js.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
        sub_filter '</body>' '<script src="/assets/showroom/selo.js" defer></script></body>';
        sub_filter_once on;
    }
}
