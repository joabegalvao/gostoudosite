server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # atrás do proxy do EasyPanel, os redirecionamentos (/pasta -> /pasta/)
    # precisam ser relativos, sem host nem porta
    absolute_redirect off;
    port_in_redirect off;

    # compressão de texto
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # fontes e imagens (deste site e dos sites dos clientes): cache longo
    location ~* \.(css|js|woff2|webp|jpg|jpeg|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # as páginas são sempre revalidadas
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
